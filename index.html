<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>OMSC</title>
    <link rel="icon" href="icon.svg">
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <meta name='description' content='A stoichiometry calculator for the Zachtronics game &quot;Opus Magnum&quot;'>
    <link rel='stylesheet' type='text/css' media='screen' href='https://cdn.jsdelivr.net/gh/ErikHaag/Opus-Magnum-Assets/bases/base.css'>
    <link rel='stylesheet' type='text/css' media='screen' href='https://cdn.jsdelivr.net/gh/ErikHaag/Opus-Magnum-Assets/symbols/base.css'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
</head>

<body class="light">
    <div id="helpBox" hidden>
        <p></p>
        <button id="closeHelp">Close</button>
        <button id="nextHelp">Next</button>
    </div>
    <!-- Menu -->
    <h1>Opus Magnum Stoichiometry Calculator</h1>
    <nav id="mainNav">
        <button>Mods</button>
        <button>Reagents</button>
        <button>Products</button>
        <button>Glyphs</button>
        <button>Timeline</button>
    </nav>
    <main class="panels">
        <div id="modPanel" class="visible" >
            <div class="pairs">

            </div>
        </div>
        <div id="reagentPanel">
            <button id="addReagent" title="Add a new reagent" aria-label="Add a new reagent">+</button>
            <div></div>
        </div>
        <div id="productPanel">
            <button id="addProduct" title="Add a new product" aria-label="Add a new product">+</button>
            <div></div>
        </div>
        <div id="glyphPanel">
            <div></div>
        </div>
        <div id="timelinePanel"></div>
    </main>
</body>
<!-- <script src="help.js"></script> -->
<script src='utilities.js'></script>
<script src='atomType.js'></script>
<script src='glyphStructure.js'></script>
<script src='modData.js'></script>
<script src='components.js'></script>
<script src='uiUpdater.js'></script>
<script src='main.js'></script>
</html>
